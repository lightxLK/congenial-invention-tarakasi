name: Build & Deploy to FTP

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'misc/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build static site
        working-directory: frontend
        run: yarn build
        env:
          GENERATE_SOURCEMAP: false

      - name: Deploy build/ to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./frontend/build/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Rebrand copy for ssjewellerskataka.com
        run: |
          cp -r frontend/build frontend/build-ss
          cd frontend/build-ss
          sed -i 's/katakatarakasi\.com/ssjewellerskataka.com/g' index.html robots.txt sitemap.xml llms.txt
          sed -i 's#og:site_name" content="Tarakasi"#og:site_name" content="SS Jewellers · Tarakasi"#; s#<title>Tarakasi: The Silver Filigree of Cuttack</title>#<title>Tarakasi: The Silver Filigree of Cuttack | SS Jewellers</title>#' index.html

      - name: Deploy build-ss/ to FTP (ssjewellerskataka.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SS_HOST }}
          username: ${{ secrets.FTP_SS_USERNAME }}
          password: ${{ secrets.FTP_SS_PASSWORD }}
          port: 21
          local-dir: ./frontend/build-ss/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Verify deployment
        run: |
          for d in katakatarakasi.com ssjewellerskataka.com; do
            for i in $(seq 1 12); do
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 https://$d/)
              [ "$STATUS" = "200" ] && break
              sleep 5
            done
            [ "$STATUS" = "200" ] || { echo "Verification failed: $d got HTTP $STATUS"; exit 1; }
          done
